<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <!-- 登录守卫：必须最先加载（同步脚本），未登录在渲染前跳回登录页 -->
    <script src="../js/auth-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智枢知库 · 知识问答与文档导入</title>
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --brand:#4f6ef7; --brand2:#7c9bff;
    --success:#10b981; --warning:#f59e0b; --error:#ef4444;
    --ink:#1c2333; --muted:#8a94a8;
    --bg:#f6f7fb; --panel:#ffffff; --border:#e6e9f2;
    --shadow:0 8px 24px -12px rgba(28,42,80,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);overflow:hidden}

  /* 关键修复 1（横向）：中栏必须写 minmax(0,1fr)。
     裸写 1fr = minmax(auto,1fr)，auto 会取内容的 min-content ——
     答案里一旦出现长串不可断字符，整列被顶到 1300px+，
     三栏总和撑破视口，左侧导航被挤到屏外、右侧导入面板被裁掉。
     关键修复 2（纵向）：显式锁死行高，否则内容变长会把整页撑高，
     .chat 的 overflow-y:auto 失效，底部输入区被挤出视口。 */
  .app{
    display:grid;
    grid-template-columns:224px minmax(0,1fr) 348px;
    grid-template-rows:minmax(0,1fr);
    height:100vh;height:100dvh;width:100%;max-width:100vw;overflow:hidden;
  }
  body.panel-hidden .app{grid-template-columns:224px minmax(0,1fr) 0}
  body.panel-hidden .import-panel{display:none}

  /* 窄屏自适应：保证任何窗口宽度下三块内容都完整可见 */
  @media (max-width:1320px){
    .app{grid-template-columns:200px minmax(0,1fr) 318px}
    body.panel-hidden .app{grid-template-columns:200px minmax(0,1fr) 0}
  }
  @media (max-width:1080px){
    .app{grid-template-columns:176px minmax(0,1fr)}
    body.panel-hidden .app{grid-template-columns:176px minmax(0,1fr)}
    .import-panel{
      position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);z-index:30;
      box-shadow:-18px 0 44px -22px rgba(28,42,80,.45);
    }
  }
  @media (max-width:760px){
    .app{grid-template-columns:minmax(0,1fr)}
    body.panel-hidden .app{grid-template-columns:minmax(0,1fr)}
    .side{display:none}
  }

  /* 统一细滚动条，让「可滑动区域」一眼可见 */
  .chat,.panel-body,.side{scrollbar-width:thin;scrollbar-color:#c8d0e2 transparent}
  .chat::-webkit-scrollbar,.panel-body::-webkit-scrollbar,.side::-webkit-scrollbar{width:10px;height:10px}
  .chat::-webkit-scrollbar-track,.panel-body::-webkit-scrollbar-track,.side::-webkit-scrollbar-track{background:transparent}
  .chat::-webkit-scrollbar-thumb,.panel-body::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{
    background:#c8d0e2;border-radius:999px;border:3px solid transparent;background-clip:content-box;
  }
  .chat::-webkit-scrollbar-thumb:hover,.panel-body::-webkit-scrollbar-thumb:hover,.side::-webkit-scrollbar-thumb:hover{
    background:#9fadc9;border:3px solid transparent;background-clip:content-box;
  }

  /* ========== 左侧导航 ========== */
  .side{
    background:linear-gradient(180deg,#fbfcff 0%,#f1f4fb 100%);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;
    min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
  }
  .logo{display:flex;align-items:center;gap:11px;padding:2px 6px 20px}
  .logo-badge{
    width:40px;height:40px;border-radius:13px;
    background:linear-gradient(135deg,#11b388,#4fd1b5);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -8px rgba(17,179,136,.6);
  }
  .logo-badge svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .logo-name{font-size:16px;font-weight:600}
  .logo-sub{font-size:11px;color:var(--muted);margin-top:2px}

  .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;font-size:13.5px;
    color:#4a5a72;cursor:pointer;transition:all .2s;user-select:none;
  }
  .nav-item:hover{background:rgba(79,110,247,.06)}
  .nav-item.active{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;font-weight:600;
    box-shadow:0 8px 18px -8px rgba(79,110,247,.55);
  }
  .nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav-badge{
    margin-left:auto;background:var(--warning);color:#fff;
    font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;display:none;
  }
  .nav-badge.show{display:inline-block}

  .side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 8px 0;border-top:1px dashed var(--border)}
  .svc{display:flex;align-items:center;gap:7px;padding:4px 0}
  .svc .dot{width:7px;height:7px;border-radius:50%;background:#c6cddc;flex-shrink:0;transition:background .3s}
  .svc .dot.ok{background:var(--success);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
  .svc .dot.bad{background:var(--error);box-shadow:0 0 0 3px rgba(239,68,68,.12)}

  /* ========== 中间：知识问答 ========== */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:14px 22px;background:rgba(255,255,255,.8);
    border-bottom:1px solid var(--border);backdrop-filter:blur(10px);
  }
  .topbar .title{font-size:15.5px;font-weight:600}
  .pill{
    font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;
    background:#f1f3f9;color:var(--muted);transition:all .3s;
  }
  .pill.connected{background:rgba(79,110,247,.1);color:var(--brand)}
  .btn-ghost{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--border);background:#fff;color:#4a5a72;
    font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;
    transition:all .2s;font-family:var(--font);
  }
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn-ghost svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

  .chat{
    flex:1 1 0;min-height:0;min-width:0;
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    padding:24px 26px 18px;display:flex;flex-direction:column;gap:16px;
  }
  .dayline{text-align:center;font-size:11px;color:var(--muted);margin:2px 0 6px}
  .empty-hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px;line-height:1.9}
  .msg{display:flex;gap:10px;max-width:78%;min-width:0}
  .msg>div:last-child{min-width:0}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{
    width:32px;height:32px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;
  }
  .avatar.bot{background:linear-gradient(135deg,#11b388,#4fd1b5)}
  .avatar.user{background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .bubble{
    background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:12px 15px;font-size:13.5px;line-height:1.7;
    box-shadow:0 2px 8px -4px rgba(28,42,80,.08);min-width:0;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;border:none;border-top-right-radius:5px;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  }
  .msg.bot .bubble{border-top-left-radius:5px}
  .meta{font-size:10.5px;color:var(--muted);margin-top:6px}
  .msg.user .meta{color:rgba(255,255,255,.75)}
  /* overflow-wrap:anywhere 会同时作用于「固有尺寸」计算，
     长串英文/URL 不再把父级 min-content 顶宽（这正是横向撑破的元凶） */
  .answer-text{word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}

  /* 轻量 Markdown 元素 */
  .answer-text p {
      margin: 0 0 8px
  }

  .answer-text p:last-child {
      margin-bottom: 0
  }

  .answer-text h1, .answer-text h2, .answer-text h3,
  .answer-text h4, .answer-text h5, .answer-text h6 {
      margin: 12px 0 6px;
      font-weight: 600;
      line-height: 1.4;
  }

  .answer-text h1 {
      font-size: 18px
  }

  .answer-text h2 {
      font-size: 16.5px
  }

  .answer-text h3 {
      font-size: 15.5px
  }

  .answer-text h4, .answer-text h5, .answer-text h6 {
      font-size: 14.5px
  }

  .answer-text h1:first-child, .answer-text h2:first-child,
  .answer-text h3:first-child {
      margin-top: 0
  }

  .answer-text ul, .answer-text ol {
      margin: 4px 0 10px;
      padding-left: 22px
  }

  .answer-text li {
      margin: 3px 0
  }

  .answer-text code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      background: var(--surface-2, #f4f4f6);
      border: 1px solid var(--border, #e5e5ea);
      border-radius: 5px;
      padding: 1px 5px;
  }

  .answer-text a {
      color: var(--accent, #4a7dbd);
      text-decoration: none
  }

  .answer-text a:hover {
      text-decoration: underline
  }

  .answer-text del {
      color: var(--muted, #999)
  }
  .answer-images{margin-top:10px;display:flex;flex-direction:column;gap:10px}
  .answer-images img{
    display:block;max-width:min(100%,600px);max-height:600px;
    border-radius:10px;border:1px solid var(--border);
    box-shadow:var(--shadow);background:#fff;
  }
  .answer-src{font-size:10.5px;color:var(--muted);margin-top:8px;display:block}

  /* 「回到最新」悬浮按钮：向上翻阅历史、不再自动跟随底部时出现 */
  .scroll-bottom{
    position:absolute;right:26px;bottom:128px;z-index:6;
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:1px solid var(--border);background:#fff;color:var(--brand);
    box-shadow:0 6px 18px -8px rgba(28,42,80,.35);
    display:none;align-items:center;justify-content:center;
    transition:transform .2s,box-shadow .2s;font-family:var(--font);
  }
  .scroll-bottom.show{display:flex}
  .scroll-bottom:hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(28,42,80,.45)}
  .scroll-bottom svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 流水线进度卡 */
  .progress-card{
    background:#fbfcff;border:1px solid var(--border);
    border-radius:14px;overflow:hidden;margin-bottom:10px;
    box-shadow:0 2px 8px -6px rgba(28,42,80,.1);
  }
  .progress-card.failed{border-color:rgba(239,68,68,.35)}
  .progress-head{
    display:flex;align-items:center;gap:9px;padding:10px 13px;
    border-bottom:1px dashed var(--border);
    cursor:pointer;list-style:none;   /* 折叠标题：去掉浏览器默认的「详情 ▶」三角 */
  }
  .progress-head::-webkit-details-marker{display:none}
  .progress-icon{
    width:24px;height:24px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:flex;align-items:center;justify-content:center;
  }
  .progress-icon svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .progress-title{font-size:12px;font-weight:600}
  .progress-label{font-size:11px;color:var(--muted);margin-left:auto}
  .progress-list{padding:7px 13px 10px;min-width:0}
  .progress-item{
    display:flex;align-items:center;gap:8px;font-size:12px;color:#4a5a6e;padding:4px 0;
    min-width:0;overflow-wrap:anywhere;word-break:break-word;
  }
  .step-mark{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .item-done .step-mark{background:var(--success)}
  .item-done .step-mark::after{
    content:'';width:4px;height:7px;
    border:solid #fff;border-width:0 1.5px 1.5px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  .item-run{color:var(--brand);font-weight:600}
  .item-run .step-mark{
    border:2px solid rgba(79,110,247,.25);border-top-color:var(--brand);
    animation:spin .7s linear infinite;
  }
  .item-wait{color:var(--muted);opacity:.65}
  .item-wait .step-mark{background:#dde2ec}
  .item-fail .step-mark{background:var(--error)}
  .item-fail .step-mark::after{content:'×';color:#fff;font-size:11px;font-weight:700;line-height:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  .typing{display:inline-flex;gap:5px;align-items:center;padding:2px 0}
  .typing .dot{
    width:7px;height:7px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    animation:typingBounce 1.3s infinite ease-in-out;
  }
  .typing .dot:nth-child(2){animation-delay:.15s}
  .typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes typingBounce{
    0%,70%,100%{transform:translateY(0) scale(.85);opacity:.5}
    35%{transform:translateY(-6px) scale(1);opacity:1}
  }

  /* 输入区 */
  .composer-wrap{border-top:1px solid var(--border);background:rgba(255,255,255,.85);padding:14px 22px 16px}
  .composer{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1.5px solid var(--border);
    border-radius:16px;padding:6px 6px 6px 16px;
    transition:border-color .2s, box-shadow .2s;
  }
  .composer:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,110,247,.1)}
  .composer input{
    flex:1;border:none;outline:none;font-size:13.5px;
    font-family:var(--font);color:var(--ink);background:transparent;
  }
  .composer input::placeholder{color:#b3bccf}
  .send{
    border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;font-size:13px;font-weight:600;
    padding:9px 20px;border-radius:12px;font-family:var(--font);
    box-shadow:0 6px 14px -6px rgba(79,110,247,.55);
  }
  .send:disabled{opacity:.55;cursor:not-allowed}
  .hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
  .kbd{
    background:#eef1f7;border:1px solid var(--border);border-bottom-width:2px;
    border-radius:5px;padding:0 5px;font-size:10px;
  }
  .stream-toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#4a5a72;cursor:pointer;user-select:none}
  .stream-toggle input{accent-color:var(--brand)}

  /* ========== 右侧：文档导入面板 ========== */
  .import-panel{
    background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  .panel-head{
    display:flex;align-items:center;gap:9px;
    padding:15px 18px;border-bottom:1px solid var(--border);
  }
  .panel-head .pt{font-size:14px;font-weight:600}
  .panel-head .pc{
    margin-left:auto;font-size:11px;color:var(--muted);
    background:#f1f3f9;padding:3px 10px;border-radius:999px;
  }
  .panel-close{
    border:none;background:transparent;cursor:pointer;color:var(--muted);
    font-size:15px;line-height:1;padding:2px 4px;font-family:var(--font);
  }
  .panel-close:hover{color:var(--ink)}
  .panel-body{flex:1 1 0;min-height:0;overflow-y:auto;padding:16px}

  .dropzone{
    border:2px dashed #b9c6f5;border-radius:16px;
    padding:26px 16px;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,rgba(79,110,247,.04),rgba(124,155,255,.03));
    transition:all .2s;
  }
  .dropzone:hover,.dropzone.drag{background:rgba(79,110,247,.08);border-color:var(--brand)}
  .dz-icon{
    width:44px;height:44px;border-radius:14px;margin:0 auto 10px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -8px rgba(79,110,247,.55);
  }
  .dz-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .dz-main{font-size:13px;font-weight:600}
  .dz-sub{font-size:11px;color:var(--muted);margin-top:4px}

  .file-card{
    border:1px solid var(--border);border-radius:14px;
    padding:13px 14px;margin-top:12px;background:#fff;
    box-shadow:0 2px 8px -6px rgba(28,42,80,.08);
  }
  .fc-top{display:flex;align-items:center;gap:9px}
  .fc-icon{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;
  }
  .fc-icon.pdf{background:linear-gradient(135deg,#ef4444,#f97316)}
  .fc-icon.md{background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .fc-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fc-size{font-size:10.5px;color:var(--muted);margin-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;flex-shrink:0}
  .badge.completed{background:rgba(16,185,129,.12);color:var(--success)}
  .badge.processing{background:rgba(79,110,247,.1);color:var(--brand)}
  .badge.uploading{background:rgba(245,158,11,.14);color:var(--warning)}
  .badge.failed{background:rgba(239,68,68,.1);color:var(--error)}

  .bar{height:5px;background:#eef1f7;border-radius:999px;margin-top:11px;overflow:hidden;display:none}
  .bar.show{display:block}
  .bar i{display:block;height:100%;border-radius:999px;transition:width .3s,background .3s}
  .bar .done{width:100%;background:linear-gradient(90deg,#10b981,#34d399)}
  .bar .doing{width:30%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
  .bar .uploading{width:60%;background:linear-gradient(90deg,#f59e0b,#fbbf24)}

  .fc-log{margin-top:9px;font-size:11px;color:var(--muted)}
  .fc-log summary{cursor:pointer;color:#6b7893;user-select:none;list-style:none}
  .fc-log summary::-webkit-details-marker{display:none}
  .fc-log ul{list-style:none;margin-top:7px;display:flex;flex-direction:column;gap:4px}
  .fc-log li{display:flex;align-items:center;gap:6px}
  .mini-done{
    width:13px;height:13px;border-radius:50%;background:var(--success);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .mini-done::after{
    content:'';width:3px;height:6px;
    border:solid #fff;border-width:0 1.3px 1.3px 0;transform:rotate(45deg) translate(-.5px,-.5px);
  }
  .mini-run{
    width:13px;height:13px;border-radius:50%;flex-shrink:0;
    border:2px solid rgba(79,110,247,.25);border-top-color:var(--brand);
    animation:spin .7s linear infinite;
  }
  .fc-log li.run{color:var(--brand);font-weight:600}
</style>
</head>
<body>

<div class="app">

  <!-- ===== 左侧导航 ===== -->
  <aside class="side">
    <div class="logo">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M12 6.5c-2.2-1.3-5-1.3-7.2 0v11c2.2-1.3 5-1.3 7.2 0 2.2-1.3 5-1.3 7.2 0v-11c-2.2-1.3-5-1.3-7.2 0z"/><line x1="12" y1="6.5" x2="12" y2="17.5"/></svg>
      </div>
      <div>
        <div class="logo-name">智枢知库</div>
        <div class="logo-sub">知识库智能体</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-item" id="navChat">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
        知识问答
      </div>

      <div class="hint"><span class="kbd">Enter</span> 发送 · <span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行 · 回答由知识库检索生成</div>

<script>
/* =========================================================
   智枢知库 · 合并页（问答 + 导入）
   后端零改动：问答 API(:8101) 与导入 API(:8104) 均为跨域直连，
   两个后端已开启 CORS(allow_origins=*)。
   ========================================================= */
'use strict';

const QUERY_BASE  = 'http://127.0.0.1:8101';
const IMPORT_BASE = 'http://127.0.0.1:8104';

/* ---------- 会话 ID（本地持久化） ---------- */
let sessionId = localStorage.getItem('kb_session_id');
if (!sessionId) {
  sessionId = 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('kb_session_id', sessionId);
}

/* 把网络层错误翻译成人话（避免直接抛 "Failed to fetch"） */
function friendlyErr(error, service) {
  const msg = (error && error.message) ? String(error.message) : String(error);
  if (error instanceof TypeError || /failed to fetch|networkerror|load failed|fetch/i.test(msg)) {
    return '无法连接' + (service || '后端服务') + '，请确认对应服务已启动';
  }
  return msg;
}

/* ---------- 通用工具 ---------- */
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* 滚动状态：true = 自动跟随底部（用户没有向上翻阅） */
let stickToBottom = true;
function chatIsNearBottom(el, threshold) {
  return (el.scrollHeight - el.scrollTop - el.clientHeight) <= (threshold == null ? 60 : threshold);
}
/* force=true 时无视用户当前位置，强制跳到底部 */
function scrollToBottom(force) {
  const chatEl = document.getElementById('chatEl');
  if (!chatEl) return;
  if (!force && !stickToBottom) return;
  chatEl.scrollTop = chatEl.scrollHeight;
  stickToBottom = true;
}
function hideEmptyHint() {
  const h = document.getElementById('emptyHint');
  if (h) h.remove();
}
function normalizeDoneLog(t) {
  t = String(t == null ? '' : t);
  return t.endsWith('已完成') ? t : t + '已完成';
}
function normalizeRunningLog(t) {
  t = String(t == null ? '' : t);
  if (t.startsWith('正在进行')) return t.endsWith('...') ? t : t + '...';
  return '正在进行' + t + '...';
}

/* =========================================================
   一、知识问答（:8101）
   ========================================================= */
const chatEl   = document.getElementById('chatEl');
const inputEl  = document.getElementById('inputEl');
const sendBtn  = document.getElementById('sendBtn');
const apiPill  = document.getElementById('apiPill');
const streamToggle = document.getElementById('streamToggle');
const scrollBottomBtn = document.getElementById('scrollBottom');
let currentEventSource = null;
let currentStreamDone = false;

/* 用户手动向上翻阅时不再强制拉回底部，「回到底部」按钮出现 */
function updateStickState() {
  const atBottom = chatIsNearBottom(chatEl);
  stickToBottom = atBottom;
  if (scrollBottomBtn) {
    scrollBottomBtn.classList.toggle('show', !atBottom && chatEl.scrollHeight > chatEl.clientHeight + 40);
  }
}
chatEl.addEventListener('scroll', updateStickState, { passive: true });
if (scrollBottomBtn) scrollBottomBtn.addEventListener('click', () => scrollToBottom(true));

function closeCurrentStream() {
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
}
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function tsToTime(ts) {
  try {
    const d = new Date(ts);
    if (isNaN(d)) return nowTime();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  } catch (_) { return nowTime(); }
}

function addUserMsgWithTime(text, ts) {
  hideEmptyHint();
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML =
    '<div class="avatar user">佳</div>' +
    '<div><div class="bubble">' + escapeHtml(text) + '</div>' +
    '<div class="meta">' + tsToTime(ts) + '</div></div>';
  chatEl.appendChild(el);
  scrollToBottom();
}
function addUserMsg(text) { addUserMsgWithTime(text, Date.now()); }

function addBotMsgSkeleton() {
  hideEmptyHint();
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML =
    '<div class="avatar bot">知</div>' +
    '<div><div class="bubble">' +
      '<span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>' +
    '</div><div class="meta">' + nowTime() + '</div></div>';
  chatEl.appendChild(el);
  scrollToBottom();
  return el;
}

/* 进度卡：doneList / runningList 为节点名数组 */
function ensureProgressCard(botMsgEl) {
  let card = botMsgEl.querySelector('.progress-card');
  if (card) return card;
  const wrap = botMsgEl.children[1];
  const bubble = wrap.querySelector('.bubble');
  card = document.createElement('details');
  card.className = 'progress-card';
  card.open = true;
  card.innerHTML =
    '<summary class="progress-head">' +
      '<div class="progress-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></div>' +
      '<span class="progress-title">处理流水线</span>' +
      '<span class="progress-label">0 / 0 已完成</span>' +
    '</summary>' +
    '<div class="progress-list"></div>';
  bubble.parentNode.insertBefore(card, bubble);
  return card;
}

function renderProgress(botMsgEl, doneList, runningList, status) {
  const card = ensureProgressCard(botMsgEl);
  const listEl = card.querySelector('.progress-list');
  const label = card.querySelector('.progress-label');
  const done = Array.isArray(doneList) ? doneList : [];
  const running = Array.isArray(runningList) ? runningList : [];
  label.textContent = done.length + ' / ' + (done.length + running.length) + ' 已完成';

  let html = '';
  for (const name of done) {
    html += '<div class="progress-item item-done"><span class="step-mark"></span>' + escapeHtml(name) + '</div>';
  }
  for (const name of running) {
    html += '<div class="progress-item item-run"><span class="step-mark"></span>' + escapeHtml(name) + '</div>';
  }
  if (!html) html = '<div class="progress-item item-wait"><span class="step-mark"></span>等待任务开始…</div>';
  listEl.innerHTML = html;
  scrollToBottom();
}

function markProgressFinal(botMsgEl, isError) {
  const card = botMsgEl.querySelector('.progress-card');
  if (!card) return;
  card.querySelectorAll('.progress-item.item-run').forEach((el) => {
    el.classList.remove('item-run');
    el.classList.add(isError ? 'item-fail' : 'item-done');
  });
  const label = card.querySelector('.progress-label');
  if (label && isError) label.textContent = '失败';
}

/* 轻量 Markdown 渲染：先整体转义防 XSS，再按语法加标签。
   图片标记 ![..](..) 从正文中剔除——图片由后端 image_urls 单独展示，避免重复 */
function mdToHtml(src) {
    const lines = String(src == null ? '' : src).replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let listTag = null; // 'ul' | 'ol'
    const closeList = () => {
        if (listTag) {
            html += '</' + listTag + '>';
            listTag = null;
        }
    };
    const inline = (s) => s
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/~~([^~]+)~~/g, '<del>$1</del>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    for (const line of lines) {
        const h = line.match(/^(#{1,6})\s+(.*)/);
        const ul = line.match(/^\s*[-*+]\s+(.*)/);
        const ol = line.match(/^\s*\d+[.、)]\s+(.*)/);
        if (h) {
            closeList();
            const lv = h[1].length;
            html += '<h' + lv + '>' + inline(escapeHtml(h[2])) + '</h' + lv + '>';
        } else if (ul) {
            if (listTag !== 'ul') {
                closeList();
                html += '<ul>';
                listTag = 'ul';
            }
            html += '<li>' + inline(escapeHtml(ul[1])) + '</li>';
        } else if (ol) {
            if (listTag !== 'ol') {
                closeList();
                html += '<ol>';
                listTag = 'ol';
            }
            html += '<li>' + inline(escapeHtml(ol[1])) + '</li>';
        } else if (!line.trim()) {
            closeList();
        } else {
            closeList();
            const p = inline(escapeHtml(line));
            if (p) html += '<p>' + p + '</p>';
        }
    }
    closeList();
    return html;
}

function renderAnswerWithImages(containerEl, answerText, imageUrls) {
    containerEl.innerHTML = '<div class="answer-text">' + mdToHtml(answerText) + '</div>';
    const urls = Array.isArray(imageUrls) ? imageUrls.filter((u) => typeof u === 'string' && /^https?:\/\//i.test(u.trim())) : [];
  if (urls.length) {
    const box = document.createElement('div');
    box.className = 'answer-images';
    for (const u of urls) {
      const img = document.createElement('img');
      img.src = u;
      img.alt = '知识库配图';
        /* 地址失联（旧环境/被清理的对象）时移除裂图，不再显示破图标 */
        img.onerror = () => img.remove();
      box.appendChild(img);
    }
    containerEl.appendChild(box);
  }
}

function finalizeBotAnswer(botMsgEl, answer, error, imageUrls) {
  const wrap = botMsgEl.children[1];
  const bubble = wrap.querySelector('.bubble');
  let answerEl = bubble.querySelector('.answer');
  if (!answerEl) {
    answerEl = document.createElement('div');
    answerEl.className = 'answer';
    bubble.insertBefore(answerEl, bubble.firstChild);
  }
  const text = (error && (!answer || !String(answer).trim()))
    ? ('抱歉，本次回答出错：' + error)
    : (answer || '');
  renderAnswerWithImages(answerEl, text, imageUrls);
  const typing = botMsgEl.querySelector('.typing');
  if (typing) typing.remove();
  scrollToBottom();
}

/* API 连通状态：null=还没探过 / true=已连接 / false=未连接
   （BUG-9：徽标已经亮成「未连接」时，点发送不该再傻等约 2.1 秒的网络超时） */
let apiConnected = null;

function setPill(connected) {
  apiConnected = connected;
  apiPill.textContent = connected ? 'API 已连接' : 'API 未连接';
  apiPill.classList.toggle('connected', !!connected);
}

async function apiHealth() {
  try {
    const res = await fetch(QUERY_BASE + '/health');
    setPill(!!res.ok);
  } catch (_) {
    setPill(false);
  }
}

/* 轻量探活：只问 /health，带超时，用来判断「徽标是不是过期了」 */
async function probeQueryApi(timeoutMs) {
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, timeoutMs || 1200);
  try {
    const res = await fetch(QUERY_BASE + '/health', {cache: 'no-store', signal: ctrl && ctrl.signal});
    return !!(res && res.ok);
  } catch (_) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

/* 在气泡里立刻落一条本地可读提示（不走网络、不假装有答案） */
function localNotice(botMsgEl, text) {
  const bubble = botMsgEl.children[1].querySelector('.bubble');
  let el = bubble.querySelector('.answer');
  if (!el) {
    el = document.createElement('div');
    el.className = 'answer';
    bubble.insertBefore(el, bubble.firstChild);
  }
  el.textContent = text;
  return el;
}

async function loadHistory() {
  try {
    const res = await fetch(QUERY_BASE + '/history/' + encodeURIComponent(sessionId));
    if (!res.ok) return;
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    for (const item of items) {
      if (item.role === 'user') addUserMsgWithTime(item.text || '', item.ts);
      else {
        hideEmptyHint();
        const el = addBotMsgSkeleton();
        finalizeBotAnswer(el, item.text || '', null, item.image_urls || []);
      }
    }
    scrollToBottom(true);
    updateStickState();
  } catch (_) {}
}

async function submitQuery(text) {
  const isStream = streamToggle.checked;
  const res = await fetch(QUERY_BASE + '/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: text, session_id: sessionId, is_stream: isStream })
  });
  if (!res.ok) {
    const msg = await res.text();
    throw new Error(msg || '请求失败');
  }
  return await res.json();
}

async function onSend() {
  const text = (inputEl.value || '').trim();
  if (!text) return;
  inputEl.value = '';
  closeCurrentStream();
  stickToBottom = true;   /* 主动发问 = 回到最新位置 */

  addUserMsg(text);
  const botMsgEl = addBotMsgSkeleton();
  sendBtn.disabled = true;

  /* BUG-9：徽标已亮「API 未连接」时，别再走那条要等约 2.1 秒才有反馈的网络路径。
     先本地落一条可读提示，同时做一次轻量探活（1.2 秒上限）：
     后端其实已经起来了 → 抹掉提示正常发问；确实不通 → 立即收尾，问题留在输入框可重试。 */
  if (apiConnected === false) {
    localNotice(botMsgEl,
      '知库问答服务 (:8101) 当前未连接，这条提问没有发出。' +
      '请确认问答后端已启动；内容已保留在输入框，可直接重试。');
    const alive = await probeQueryApi(1200);
    setPill(alive);
    if (!alive) {
      const typing = botMsgEl.querySelector('.typing');
      if (typing) typing.remove();
      inputEl.value = text;
      sendBtn.disabled = false;
      return;
    }
    localNotice(botMsgEl, '').remove();   /* 探活成功，接着走正常流程 */
  }

  try {
    const isStream = streamToggle.checked;
    const data = await submitQuery(text);

    renderProgress(botMsgEl, [], [], 'pending');

    if (!isStream) {
      renderProgress(botMsgEl, data.done_list || [], [], 'completed');
      finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
      sendBtn.disabled = false;
      return;
    }

    /* 流式：SSE */
    const sid = data.session_id || sessionId;
    const wrap = botMsgEl.children[1];
    const bubble = wrap.querySelector('.bubble');
    let answerEl = bubble.querySelector('.answer');
    if (!answerEl) {
      answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.insertBefore(answerEl, bubble.firstChild);
    }

    const es = new EventSource(QUERY_BASE + '/stream/' + encodeURIComponent(sid));
    currentEventSource = es;
    currentStreamDone = false;
    let rawAnswerText = '';

    es.addEventListener('progress', (e) => {
      try {
        const d = JSON.parse(e.data || '{}');
        renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
        if (d.status === 'completed') {
          const typing = botMsgEl.querySelector('.typing');
          if (typing) typing.remove();
          sendBtn.disabled = false;
        }
      } catch (_) {}
    });

    es.addEventListener('delta', (e) => {
      try {
        const d = JSON.parse(e.data || '{}');
        const delta = d.delta || '';
        if (delta) {
          rawAnswerText += delta;
          renderAnswerWithImages(answerEl, rawAnswerText, []);
          scrollToBottom();
        }
      } catch (_) {}
    });

    const handleFinal = (e) => {
      if (currentStreamDone) return;
      currentStreamDone = true;
      const typing = botMsgEl.querySelector('.typing');
      if (typing) typing.remove();
      markProgressFinal(botMsgEl, false);
      try {
        const d = JSON.parse(e.data || '{}');
        const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0)
          ? d.answer
          : (rawAnswerText || answerEl.textContent || '');
        renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
      } catch (_) {}
      es.close();
      currentEventSource = null;
      sendBtn.disabled = false;
    };
    es.addEventListener('final', handleFinal);
    es.addEventListener('final_answer', handleFinal);

    es.addEventListener('error', (e) => {
      if (currentStreamDone) return;
      currentStreamDone = true;
      const typing = botMsgEl.querySelector('.typing');
      if (typing) typing.remove();
      markProgressFinal(botMsgEl, true);
      let errMsg = '无法连接知库问答服务 (:8101)，请确认后端已启动';
      try {
        if (e && e.data) { const d = JSON.parse(e.data); if (d.error) errMsg = d.error; }
      } catch (_) {}
      rawAnswerText += '\n\n（错误：' + errMsg + '）';
      renderAnswerWithImages(answerEl, rawAnswerText, []);
      es.close();
      currentEventSource = null;
      sendBtn.disabled = false;
    });

  } catch (e) {
    const wrap = botMsgEl.children[1];
    const bubble = wrap.querySelector('.bubble');
    const typing = bubble.querySelector('.typing');
    if (typing) typing.remove();
    const card = botMsgEl.querySelector('.progress-card');
    if (card) { card.classList.add('failed'); card.open = false; }
    let answerEl = bubble.querySelector('.answer');
    if (!answerEl) {
      answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.insertBefore(answerEl, bubble.firstChild);
    }
    answerEl.textContent = '请求失败：' + friendlyErr(e, '知库问答服务 (:8101)');
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', onSend);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
});

document.getElementById('btnClear').addEventListener('click', async () => {
  if (!confirm('确定要开启新对话吗？当前会话历史将被清空且无法恢复。')) return;
  closeCurrentStream();
  try {
    const res = await fetch(QUERY_BASE + '/history/' + encodeURIComponent(sessionId), { method: 'DELETE' });
    if (!res.ok) alert('服务端清空失败，仅清空本地显示');
  } catch (_) { alert('服务端清空失败，仅清空本地显示'); }
  const nodes = Array.from(chatEl.querySelectorAll('.msg'));
  for (const n of nodes) n.remove();
  if (!document.getElementById('emptyHint')) {
    const h = document.createElement('div');
    h.className = 'empty-hint';
    h.id = 'emptyHint';
    h.innerHTML = '基于「智枢知库」提问，右侧可导入新文档。<br>示例：我们产品的退货流程是怎样的？';
    chatEl.appendChild(h);
  }
});

/* =========================================================
   二、文档导入（:8104）
   ========================================================= */
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const navBadge = document.getElementById('navBadge');
const taskCountEl = document.getElementById('taskCount');
let activeTasks = 0;

/* 计数一律从 DOM 现算，不再靠 +1/-1 累加：
   之前 navBadge 走累加、taskCount 走 DOM，两条口径会在失败时同屏打架（徽标 0、面板「2 个任务」） */
function updateTaskBadge() {
  const cards = fileListEl.querySelectorAll('.file-card');
  let running = 0;
  cards.forEach(function (c) {
    const b = c.querySelector('.badge');
    if (b && /上传中|处理中/.test(b.textContent)) running++;
  });
  activeTasks = running;
  navBadge.textContent = String(running);
  navBadge.classList.toggle('show', running > 0);
  taskCountEl.textContent = cards.length + ' 个任务';
}

function showImportNotice(msg) {
  const old = document.getElementById('importNotice');
  if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'importNotice';
  el.style.cssText = 'padding:10px 12px;margin:0 0 10px;border-radius:10px;font-size:13px;' +
    'border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#b91c1c;cursor:pointer';
  el.textContent = msg + '（点此关闭）';
  el.addEventListener('click', () => el.remove());
  fileListEl.insertBefore(el, fileListEl.firstChild);
  setTimeout(() => { if (el.isConnected) el.remove(); }, 8000);
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });

function handleFiles(files) {
  Array.from(files).forEach(uploadFile);
}

function fileKind(name) {
  return /\.pdf$/i.test(name) ? 'pdf' : 'md';
}

async function uploadFile(file) {
  const id = 'task-' + Math.random().toString(36).slice(2, 10);
  const card = document.createElement('div');
  card.className = 'file-card';
  card.id = id;
  card.innerHTML =
    '<div class="fc-top">' +
      '<div class="fc-icon ' + fileKind(file.name) + '">' + fileKind(file.name).toUpperCase() + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="fc-name">' + escapeHtml(file.name) + '</div>' +
        '<div class="fc-size">' + (file.size / 1024).toFixed(2) + ' KB · 刚刚</div>' +
      '</div>' +
      '<span class="badge uploading">上传中…</span>' +
    '</div>' +
    '<div class="bar show"><i class="uploading"></i></div>' +
    '<details class="fc-log"><summary>日志</summary><ul><li>暂无日志</li></ul></details>';
  fileListEl.insertBefore(card, fileListEl.firstChild);

  const badge = card.querySelector('.badge');
  const bar = card.querySelector('.bar i');
  const logDetails = card.querySelector('.fc-log');
  const logList = card.querySelector('.fc-log ul');
  const logSummary = card.querySelector('.fc-log summary');

  function renderLogs(doneList, runningList) {
    const done = Array.isArray(doneList) ? doneList : [];
    const running = Array.isArray(runningList) ? runningList : [];
    logSummary.textContent = '日志（已完成 ' + done.length + '，进行中 ' + running.length + '）';
    let html = '';
    for (const n of done) html += '<li><span class="mini-done"></span>' + escapeHtml(normalizeDoneLog(n)) + '</li>';
    for (const n of running) html += '<li class="run"><span class="mini-run"></span>' + escapeHtml(normalizeRunningLog(n)) + '</li>';
    logList.innerHTML = html || '<li>暂无日志</li>';
    if (done.length + running.length === 0) logDetails.open = false;
  }

  updateTaskBadge();

  try {
    const formData = new FormData();
    formData.append('files', file);
    const response = await fetch(IMPORT_BASE + '/upload', { method: 'POST', body: formData });
    if (!response.ok) throw new Error('上传失败 (' + response.status + ')');
    const result = await response.json();
    const taskId = result.task_ids && result.task_ids[0];
    if (!taskId) throw new Error('未返回任务ID');

    badge.textContent = '处理中…';
    badge.className = 'badge processing';
    bar.className = 'doing';

    /* 每 2 秒轮询处理进度 */
    const interval = setInterval(async () => {
      try {
        const res = await fetch(IMPORT_BASE + '/status/' + encodeURIComponent(taskId));
        const data = await res.json();
        renderLogs(data.done_list, data.running_list);

        if (data.status === 'completed') {
          badge.textContent = '已完成';
          badge.className = 'badge completed';
          bar.className = 'done';
          updateTaskBadge();
          clearInterval(interval);
        } else if (data.status === 'failed') {
          badge.textContent = '失败';
          badge.className = 'badge failed';
          bar.className = 'doing';
          bar.style.background = 'linear-gradient(90deg,#ef4444,#f87171)';
          updateTaskBadge();
          clearInterval(interval);
        }
      } catch (_) { /* 轮询错误不终止 */ }
    }, 2000);

  } catch (error) {
    const msg = friendlyErr(error, '知库导入服务 (:8104)');
    /* 服务不可达＝请求根本没发出去，不该留下一张「失败」任务卡误导成"处理失败了" */
    if (error instanceof TypeError || /failed to fetch|networkerror|load failed/i.test((error && error.message) || '')) {
      card.remove();
      updateTaskBadge();
      showImportNotice('导入服务 (:8104) 未连接，文件未开始上传');
      return;
    }
    badge.textContent = '失败';
    badge.className = 'badge failed';
    bar.className = 'done';
    bar.style.width = '100%';
    bar.style.background = 'linear-gradient(90deg,#ef4444,#f87171)';
    logSummary.textContent = '日志（失败原因）';
    logList.innerHTML = '<li>' + escapeHtml(msg) + '</li>';
    logDetails.open = true;
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.textContent = '移除';
    rm.style.cssText = 'margin-top:6px;font-size:12px;padding:2px 10px;border-radius:6px;' +
      'border:1px solid var(--line,#e5e7eb);background:transparent;cursor:pointer';
    rm.addEventListener('click', function () { card.remove(); updateTaskBadge(); });
    card.appendChild(rm);
    updateTaskBadge();
  }
}

/* =========================================================
   三、面板开合
   ========================================================= */
const navImport = document.getElementById('navImport');
const navChat = document.getElementById('navChat');

navImport.addEventListener('click', () => {
  document.body.classList.toggle('panel-hidden');
  navImport.classList.toggle('active', !document.body.classList.contains('panel-hidden'));
  navChat.classList.remove('active');
});
navChat.addEventListener('click', () => {
  document.body.classList.add('panel-hidden');
  navChat.classList.add('active');
  navImport.classList.remove('active');
  inputEl.focus();
});
document.getElementById('panelClose').addEventListener('click', () => {
  document.body.classList.add('panel-hidden');
  navChat.classList.add('active');
  navImport.classList.remove('active');
});

});
